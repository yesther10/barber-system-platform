# OpenSpec Project Configuration — sistema-barberia
# Refreshed by sdd-init on 2026-08-06 from the live repository state.

schema: spec-driven

context: |
  Project: barber-system-platform / sistema-barberia multi-tenant barbershop SaaS.
  Stack: pnpm workspace + Turborepo monorepo on Node 20+ with TypeScript.
  Apps: Next.js 16 App Router web app, in-repo TS worker, shared contracts/payments packages.
  Data: Prisma 7 + MySQL/MariaDB with generated client and Zod contracts.
  Architecture: API-first monolith + worker; tenant scoping enforced by barbershopId.
  Testing: Vitest unit/integration, Testcontainers MySQL smoke/integration, Playwright E2E.
  Conventions: English code, PT-BR product copy, strict TS, ESLint only detected in apps/web.

testing:
  strict_tdd: true
  strict_tdd_source: "openspec/config.yaml marker (runner also detected)"
  detected: 2026-08-06
  runner:
    command: "pnpm test"
    framework: "Vitest"
  layers:
    unit:
      available: true
      tool: "Vitest"
    integration:
      available: true
      tool: "Vitest + Testcontainers + MySQL/MariaDB"
    e2e:
      available: true
      tool: "Playwright"
  coverage:
    available: true
    command: "pnpm test:coverage"
    provider: "v8"
  quality:
    linter:
      available: true
      command: "pnpm lint"
      tool: "ESLint via Turbo (apps/web config detected)"
    typecheck:
      available: true
      command: "pnpm typecheck"
      tool: "TypeScript"
    formatter:
      available: false
      command: ""
      tool: ""

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test && pnpm test:integration && pnpm test:e2e"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
